<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biobuzz Magazine | BRSI – VIT Chapter</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* Modal Styles matching Event Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 2000;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      padding: 20px;
      backdrop-filter: blur(8px);
    }
    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    .modal-content {
      background: var(--card-bg);
      color: var(--card-text-color);
      width: 100%;
      max-width: 1100px;
      height: 90vh;
      border-radius: var(--border-radius);
      position: relative;
      transform: translateY(20px);
      transition: transform 0.3s ease;
      border: 1px solid rgba(255,255,255,0.08);
      overflow: hidden;
    }
    .modal-overlay.active .modal-content {
      transform: translateY(0);
    }
    .modal-close {
      position: absolute;
      top: 15px;
      right: 20px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      font-size: 1.8rem;
      cursor: pointer;
      z-index: 100;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      line-height: 1;
      padding-bottom: 4px;
    }
    .modal-close:hover {
      background: rgba(0, 0, 0, 0.8);
      transform: scale(1.05);
    }
    
    /* Mobile Responsive Overrides */
    @media (max-width: 768px) {
      .modal-overlay {
        padding: 10px;
      }
      .modal-content {
        height: 95vh;
        border-radius: 12px;
      }
      .modal-close {
        top: 10px;
        right: 10px;
        width: 40px;
        height: 40px;
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <div id="navbar-container"></div>

  <main class="container">
    <!-- Featured Issue -->
    <section class="section">
      <h1 class="section-title reveal" style="margin-bottom: 30px;">Featured Biobuzz</h1>
      <div id="featured-issue" class="card reveal">
        <div class="loader"></div>
      </div>
    </section>

    <!-- Archive -->
    <section class="section">
      <h2 class="section-title reveal">Archive</h2>
      <div id="archive-grid" class="grid-4">
        <div class="loader"></div>
      </div>
    </section>
  </main>

  <!-- Biobuzz PDF / Article Viewer Modal -->
  <div class="modal-overlay" id="biobuzz-modal">
    <div class="modal-content" style="max-width: 1100px; height: 90vh; display: flex; flex-direction: column;">
      <button class="modal-close" id="close-modal-btn">&times;</button>
      <div style="flex: 1; width: 100%; height: 100%; border-radius: var(--border-radius); overflow: hidden; background: #161616;">
        <iframe id="biobuzz-iframe" src="" style="width: 100%; height: 100%; border: none;"></iframe>
      </div>
    </div>
  </div>

  <div id="footer-container"></div>

  <script src="js/supabase.js"></script>
  <script src="js/app.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/biobuzz.js"></script>
</body>
</html>
