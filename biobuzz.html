<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biobuzz Magazine | BRSI – VIT Chapter</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
  <style>
    /* Modal Styles matching Event Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 2000;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      padding: 20px;
      backdrop-filter: blur(8px);
    }
    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    .modal-content {
      background: var(--card-bg);
      color: var(--card-text-color);
      width: 100%;
      max-width: 1100px;
      height: 90vh;
      border-radius: var(--border-radius);
      position: relative;
      transform: translateY(20px);
      transition: transform 0.3s ease;
      border: 1px solid rgba(255,255,255,0.08);
      overflow: hidden;
    }
    .modal-overlay.active .modal-content {
      transform: translateY(0);
    }
    .modal-close {
      position: absolute;
      top: 15px;
      right: 20px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      font-size: 1.8rem;
      cursor: pointer;
      z-index: 100;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      line-height: 1;
      padding-bottom: 4px;
    }
    .modal-close:hover {
      background: rgba(0, 0, 0, 0.8);
      transform: scale(1.05);
    }
    
    /* Mobile Responsive Overrides */
    @media (max-width: 768px) {
      .modal-overlay {
        padding: 10px;
      }
      .modal-content {
        height: 95vh;
        border-radius: 12px;
      }
      .modal-close {
        top: 10px;
        right: 10px;
        width: 40px;
        height: 40px;
        font-size: 1.5rem;
      }
    }
    
    /* PDF Viewer Custom Styles */
    #native-pdf-reader::-webkit-scrollbar {
      width: 8px;
    }
    #native-pdf-reader::-webkit-scrollbar-track {
      background: #0b0b0b;
    }
    #native-pdf-reader::-webkit-scrollbar-thumb {
      background: rgba(140, 189, 177, 0.3);
      border-radius: 4px;
    }
    #native-pdf-reader::-webkit-scrollbar-thumb:hover {
      background: rgba(140, 189, 177, 0.5);
    }
    
    .pdf-btn {
      background: rgba(140, 189, 177, 0.1);
      color: var(--accent-color);
      border: 1px solid rgba(140, 189, 177, 0.25);
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      font-weight: 600;
      font-family: var(--font-body);
    }
    .pdf-btn:hover {
      background: var(--accent-color);
      color: var(--card-bg);
      border-color: var(--accent-color);
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(140, 189, 177, 0.3);
    }
    .pdf-btn:active {
      transform: translateY(0);
    }
    
    .pdf-page-wrapper {
      position: relative;
      width: 100%;
      background: #121212;
      border-radius: 12px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.6);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.04);
      transition: border-color 0.3s ease;
    }
    .pdf-page-wrapper:hover {
      border-color: rgba(140, 189, 177, 0.25);
    }
    .pdf-page-canvas {
      width: 100%;
      height: 100%;
      display: none;
      border-radius: 12px;
    }
    .pdf-page-loader {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #fff;
      font-family: var(--font-body);
    }
  </style>
</head>
<body>

  <div id="navbar-container"></div>

  <main class="container">
    <!-- Featured Issue -->
    <section class="section">
      <h1 class="section-title reveal" style="margin-bottom: 30px;">Featured Biobuzz</h1>
      <div id="featured-issue" class="card reveal">
        <div class="loader"></div>
      </div>
    </section>

    <!-- Archive -->
    <section class="section">
      <h2 class="section-title reveal">Archive</h2>
      <div id="archive-grid" class="grid-4">
        <div class="loader"></div>
      </div>
    </section>
  </main>

  <!-- Inline Scrolling PDF Reader (Native Experience) -->
  <div id="native-pdf-reader" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #0b0b0b; z-index: 5000; overflow-y: auto; scroll-behavior: smooth;">
    <!-- Sticky Header -->
    <div class="reader-header" style="position: sticky; top: 0; z-index: 100; height: 75px; background: rgba(17, 17, 17, 0.95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid rgba(140, 189, 177, 0.15); display: flex; align-items: center; justify-content: space-between; padding: 0 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.4);">
      <button id="reader-back-btn" class="pdf-btn" style="display: flex; align-items: center; gap: 8px;">
        &larr; Back to Issues
      </button>
      <h2 id="reader-title" style="color: var(--brand-color); font-size: 1.25rem; font-family: var(--font-heading); margin: 0; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; max-width: 50%; text-align: center;">Biobuzz Edition</h2>
      <span id="reader-page-indicator" style="color: var(--accent-color); font-weight: 500; font-size: 0.95rem; font-family: var(--font-body); min-width: 100px; text-align: right;">Page 1 of 1</span>
    </div>

    <!-- Scrollable container for stacked canvas slots -->
    <div id="reader-pages-container" style="display: flex; flex-direction: column; align-items: center; gap: 30px; padding: 40px 20px; max-width: 850px; margin: 0 auto;">
      <!-- Loaded pages will be dynamically injected here -->
    </div>
  </div>

  <div id="footer-container"></div>

  <script src="js/supabase.js"></script>
  <script src="js/app.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/biobuzz.js?v=1.1"></script>
</body>
</html>
