<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Board | BRSI – VIT Chapter</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .member-card {
      text-align: center;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .member-photo {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 20px;
      border: 4px solid var(--accent-color);
      transition: var(--transition);
    }
    .member-card:hover .member-photo {
      transform: scale(1.1);
      border-color: var(--brand-color);
    }
    .year-select-container {
      margin: 40px 0;
      text-align: center;
    }
    select.year-dropdown {
      padding: 10px 20px;
      font-size: 1.1rem;
      border-radius: var(--border-radius);
      background-color: var(--card-bg);
      color: var(--card-text-color);
      border: 1px solid var(--accent-color);
      outline: none;
      font-family: var(--font-body);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="navbar-container"></div>

  <main class="container">
    <section class="section">
      <h1 class="section-title reveal">Current Board <span id="current-year-label" style="color: var(--brand-color);"></span></h1>
      
      <div id="current-board-grid" class="grid-4">
        <div class="loader" style="grid-column: 1 / -1;"></div>
      </div>
    </section>

    <section class="section" style="border-top: 1px solid rgba(255,255,255,0.1);">
      <h2 class="section-title reveal" style="font-size: 2.5rem; margin-bottom: 20px;">Previous Boards</h2>
      
      <div class="year-select-container reveal">
        <select id="year-dropdown" class="year-dropdown">
          <option value="">Select a Year</option>
          <!-- Options injected via JS -->
        </select>
      </div>

      <div id="past-board-grid" class="grid-4">
        <!-- Rendered via JS -->
      </div>
    </section>
  </main>

  <div id="footer-container"></div>

  <script src="js/supabase.js"></script>
  <script src="js/app.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/board.js"></script>
</body>
</html>
