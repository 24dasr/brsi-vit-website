<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRSI – VIT Chapter</title>
  <meta name="description" content="Biotech Research Society, India - VIT Chapter">
  <link rel="stylesheet" href="css/style.css">
  
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div id="navbar-container"></div>

  <main class="container">
    <!-- Hero Section -->
    <section class="section">
      <div class="grid-2" style="align-items: stretch;">
        <div class="card reveal" style="padding: 40px; display: flex; flex-direction: column; justify-content: center;">
          <h1 style="font-size: 2.5rem; margin-bottom: 20px; color: var(--accent-color); font-weight: 600;">About us</h1>
          <p id="desc-about-text" style="font-size: 1.1rem; color: var(--accent-color); opacity: 0.9; line-height: 1.8;">
            The Biotech Research Society, India (BRSI) VIT Chapter is a premier student chapter dedicated to fostering research, innovation, and collaboration in the field of biotechnology. We organize events, publish magazines, and host a community of passionate researchers.
          </p>
        </div>
        <div class="reveal" style="transition-delay: 0.2s; height: 100%; min-height: 350px;">
          <img src="https://images.unsplash.com/photo-1532094349884-543bc11b234d?auto=format&fit=crop&w=800&q=80" alt="BRSI Team" style="width: 100%; height: 100%; object-fit: cover; border-radius: var(--border-radius);">
        </div>
      </div>
    </section>

    <!-- Latest Biobuzz -->
    <section class="section" style="padding-top: 0;">
      <div id="latest-biobuzz-grid" class="grid-2">
        <div class="loader"></div>
      </div>
    </section>
  </main>

  <div id="footer-container"></div>

  <script src="js/supabase.js"></script>
  <script src="js/app.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
